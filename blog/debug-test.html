<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Debug Test</title>
</head>
<body>
    <h1>Blog Debug Test</h1>
    <div id="debug-output"></div>
    <div id="loading-posts" class="loading">Loading blog posts...</div>
    <div id="posts-container" style="display: none;">
        <div id="posts-grid" class="posts-grid">
            <!-- Posts will be loaded here -->
        </div>
    </div>

    <script src="../js/config-public.js"></script>
    <script src="../js/markdown-blog-cms.js"></script>
    
    <script>
        async function testBlogLoading() {
            const debugOutput = document.getElementById('debug-output');
            
            debugOutput.innerHTML += '<p>Starting test...</p>';
            debugOutput.innerHTML += '<p>Current path: ' + window.location.pathname + '</p>';
            debugOutput.innerHTML += '<p>markdownBlogCMS exists: ' + (typeof markdownBlogCMS !== 'undefined') + '</p>';
            
            if (markdownBlogCMS) {
                try {
                    debugOutput.innerHTML += '<p>Attempting to load blog posts...</p>';
                    const posts = await markdownBlogCMS.getBlogPosts();
                    debugOutput.innerHTML += '<p>Posts loaded: ' + posts.length + '</p>';
                    debugOutput.innerHTML += '<p>First post: ' + (posts[0] ? posts[0].title : 'None') + '</p>';
                    
                    // Show posts
                    document.getElementById('loading-posts').style.display = 'none';
                    document.getElementById('posts-container').style.display = 'block';
                    
                    const postsGrid = document.getElementById('posts-grid');
                    postsGrid.innerHTML = posts.map(post => 
                        `<div style="border: 1px solid #ccc; padding: 10px; margin: 10px;">
                            <h3>${post.title}</h3>
                            <p>${post.excerpt}</p>
                            <button onclick="window.location.href='${post.slug}/'">Go to ${post.slug}</button>
                        </div>`
                    ).join('');
                    
                } catch (error) {
                    debugOutput.innerHTML += '<p style="color: red;">Error: ' + error.message + '</p>';
                }
            } else {
                debugOutput.innerHTML += '<p style="color: red;">markdownBlogCMS not found!</p>';
            }
        }
        
        // Run test when page loads
        document.addEventListener('DOMContentLoaded', testBlogLoading);
    </script>
</body>
</html>
