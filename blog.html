<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Aman Abdullayev</title>
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="57x57" href="public/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="public/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="public/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="public/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="public/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="public/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="public/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="public/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="public/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="public/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="public/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="public/favicon-16x16.png">
    <link rel="manifest" href="public/manifest.json">
    <meta name="msapplication-TileColor" href="#2563eb">
    <meta name="msapplication-TileImage" content="public/ms-icon-144x144.png">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Core styles - variables, themes, base styles -->
    <link rel="stylesheet" href="styles/core.css">
    <!-- Layout styles - containers, grids, structural elements -->
    <link rel="stylesheet" href="styles/layout.css">
    <!-- Component styles - buttons, cards, reusable elements -->
    <link rel="stylesheet" href="styles/components.css">
    <!-- Blog styles - blog-specific styling -->
    <link rel="stylesheet" href="styles/blog.css">
    <!-- Page styles - page-specific customizations -->
    <link rel="stylesheet" href="styles/pages.css">
    <!-- Responsive styles - media queries and mobile adaptations -->
    <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <img src="images/logo.png" alt="Aman Abdullayev Logo" class="logo-image">
                    Aman's Space
                </a>
                <div class="nav-buttons">
                    <a href="about.html" class="nav-btn">About</a>
                    <a href="blog.html" class="nav-btn active">Blog</a>
                    <a href="contact.html" class="nav-btn">Contact</a>
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                        <span class="theme-icon">☀️</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <section class="page-hero">
        <div class="container">
            <h1 id="page-title">Blog</h1>
            <p id="page-description">Thoughts, insights, and stories from my journey</p>
        </div>
    </section>

    <main class="container">
        <!-- Search and Filter -->
        <section class="blog-controls section">
            <div class="search-filter-bar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search posts..." />
                    <button id="search-btn">🔍</button>
                </div>
                <div class="filter-tags">
                    <button class="tag-filter active" data-tag="all">All</button>
                    <div id="tag-filters">
                        <!-- Tag filters will be generated dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Blog Posts -->
        <section class="blog-posts section">
            <div id="loading-posts" class="loading">Loading blog posts...</div>
            <div id="posts-container" style="display: none;">
                <div id="posts-grid" class="posts-grid">
                    <!-- All blog posts will be loaded here -->
                </div>
                
                <!-- Pagination -->
                <div id="pagination" class="pagination">
                    <!-- Pagination controls will be added here -->
                </div>
            </div>
            
            <div id="no-posts" class="no-posts" style="display: none;">
                <h3>No posts found</h3>
                <p>Try adjusting your search or filter criteria.</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; 2024 <span id="footer-name">Aman Abdullayev</span>. All rights reserved.</p>
                </div>
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                    <button id="footer-theme-toggle" class="theme-toggle footer-theme-toggle" aria-label="Toggle theme">
                        <span class="theme-icon">☀️</span>
                    </button>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/config-public.js"></script>
    <script src="js/config-private.js"></script>
    <script>
        // Merge private config after both scripts have loaded
        if (typeof loadPrivateConfig === 'function') {
            loadPrivateConfig();
        }
    </script>
    <script src="js/markdown-blog-cms.js"></script>
    <script src="js/main.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
