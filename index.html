<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Portfolio & Blog</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo">Your Name</a>
                <ul class="nav-links">
                    <li><a href="#home" class="active">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#blog">Blog</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="home" class="hero">
        <div class="container">
            <h1 id="hero-title">Welcome to My Digital Space</h1>
            <p id="hero-description">Loading...</p>
        </div>
    </section>

    <main class="container">
        <section id="blog" class="section">
            <h2 class="section-title">Latest Blog Posts</h2>
            <div id="loading-posts" class="loading">Loading blog posts...</div>
            <div id="posts-grid" class="posts-grid" style="display: none;">
                <!-- Blog posts will be dynamically loaded here -->
            </div>
        </section>

        <section id="about" class="section">
            <h2 class="section-title">About Me</h2>
            <div class="about-content fade-in">
                <div id="about-content">Loading...</div>
            </div>
        </section>

        <section id="contact" class="section">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-links fade-in" id="contact-links">
                <!-- Contact links will be loaded from config -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 <span id="footer-name">Your Name</span>. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/notion-api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
