<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman Abdullayev - Portfolio & Blog</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Aman Abdullayev</a>
                <div class="nav-buttons">
                    <a href="index.html" class="nav-btn active">Home</a>
                    <a href="about.html" class="nav-btn">About</a>
                    <a href="blog.html" class="nav-btn">Blog</a>
                    <a href="contact.html" class="nav-btn">Contact</a>
                </div>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 id="hero-title">Welcome to My Digital Space</h1>
            <p id="hero-description">Loading...</p>
            <div class="hero-cta">
                <a href="about.html" class="btn btn-primary">Learn More About Me</a>
                <a href="blog.html" class="btn btn-secondary">Read My Blog</a>
            </div>
        </div>
    </section>

    <main class="container">
        <!-- Introduction Section -->
        <section class="intro-section section">
            <div class="intro-content">
                <h2>What I Do</h2>
                <div id="intro-text">
                    <p>Loading introduction...</p>
                </div>
            </div>
        </section>

        <!-- Latest Blog Posts -->
        <section class="latest-posts section">
            <div class="section-header">
                <h2 class="section-title">Latest Blog Posts</h2>
                <a href="blog.html" class="view-all-link">View All Posts →</a>
            </div>
            <div id="loading-posts" class="loading">Loading latest posts...</div>
            <div id="posts-grid" class="posts-grid" style="display: none;">
                <!-- Latest 4 blog posts will be loaded here -->
            </div>
        </section>

        <!-- Quick Stats or Skills Section -->
        <section class="stats-section section">
            <h2 class="section-title">What I'm Working On</h2>
            <div class="stats-grid" id="stats-grid">
                <!-- Stats will be loaded from config -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; 2024 <span id="footer-name">Aman Abdullayev</span>. All rights reserved.</p>
                </div>
                <div class="footer-links">
                    <a href="about.html">About</a>
                    <a href="blog.html">Blog</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/notion-api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
